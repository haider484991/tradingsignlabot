# Render.com configuration
# Deploy as Background Worker (free tier: 750 hours/month)

services:
  - type: worker
    name: trading-scanner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
