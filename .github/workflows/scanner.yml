name: Stock Scanner

on:
  schedule:
    # Runs every 15 minutes during Indian market hours (3:45 AM - 10:00 AM UTC = 9:15 AM - 3:30 PM IST)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:  # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py --once
